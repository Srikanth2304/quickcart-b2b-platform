<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#001f5c"/>
            <stop offset="25%" stop-color="#1a0066"/>
            <stop offset="50%" stop-color="#3b0066"/>
            <stop offset="75%" stop-color="#6b004a"/>
            <stop offset="100%" stop-color="#a0004f"/>
        </linearGradient>

        <linearGradient id="fillCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0055ff" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="fillPink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2d9a" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#b14cff" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="fillPurple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b14cff" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#6b004a" stop-opacity="0.05"/>
        </linearGradient>

        <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00c8ff"/>
            <stop offset="100%" stop-color="#0055ff"/>
        </linearGradient>
        <linearGradient id="pinkLine" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2d9a"/>
            <stop offset="100%" stop-color="#b14cff"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" rx="20" ry="20" fill="url(#bgGradient)"/>

    <circle cx="100" cy="150" r="300" fill="#00c8ff" opacity="0.15" filter="url(#strongGlow)"/>
    <circle cx="1750" cy="150" r="350" fill="#ff2d9a" opacity="0.12" filter="url(#strongGlow)"/>
    <circle cx="250" cy="900" r="250" fill="#b14cff" opacity="0.15" filter="url(#strongGlow)"/>

    <g stroke="#b14cff" stroke-width="0.8" opacity="0.2" fill="none">
        <path d="M 350,280 L 550,200 L 800,250 L 1050,150 L 1300,200 L 1550,120"/>
        <path d="M 550,200 L 650,450 L 850,350 L 1050,150"/>
        <path d="M 800,250 L 950,500 L 1150,450 L 1300,200"/>
        <path d="M 400,900 L 550,750 L 800,850 L 1100,700 L 1400,700"/>
