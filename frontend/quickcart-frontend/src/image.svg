        <circle cx="650" cy="450" r="1.5"/><circle cx="850" cy="350" r="1.5"/><circle cx="950" cy="500" r="1.5"/><circle cx="1150" cy="450" r="1.5"/><circle cx="1400" cy="400" r="1.5"/>
