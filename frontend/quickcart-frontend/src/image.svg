        <path d="M 1750,80 L 1920,150 L 1880,260 Z"/>
        <path d="M 1750,80 L 1650,300 L 1880,260 Z"/>
        <path d="M 1650,300 L 1880,260 L 1780,450 Z"/>
        <path d="M 1880,260 L 1920,380 L 1780,450 Z"/>
        <path d="M 1300,200 L 1400,150 L 1350,280 Z"/>
