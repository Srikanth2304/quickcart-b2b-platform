        <polygon points="1300,200 1400,150 1350,280" fill="url(#fillPurple)"/>
        <polygon points="1500,400 1650,300 1620,520" fill="url(#fillPurple)"/>

        <polygon points="1400,700 1600,680 1480,850" fill="url(#fillPurple)"/>
        <polygon points="1600,680 1700,820 1480,850" fill="url(#fillPink)"/>
        <polygon points="1600,680 1920,800 1700,820" fill="url(#fillPurple)"/>
        <polygon points="1480,850 1700,820 1550,1000" fill="url(#fillPink)"/>
        <polygon points="1700,820 1800,950 1550,1000" fill="url(#fillPurple)"/>
        <polygon points="1700,820 1920,800 1920,1000" fill="url(#fillPurple)" opacity="0.5"/>
